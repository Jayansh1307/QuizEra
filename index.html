<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuizEra — Online Quiz System</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <div class="logo">Quiz<span>Era</span></div>
  </nav>

  <div class="screen active" id="screen-home">

    <div class="home-hero">
      <h1>Welcome to QuizEra,<br>Jayansh.</h1>
      <p>Choose a topic and difficulty of your own.</p>
    </div>
    <div class="category-grid" id="cat-grid"></div>

    <div class="difficulty-row">
      <span class="diff-label">Difficulty -></span>
      <button class="diff-btn active" data-diff="easy">Easy</button>
      <button class="diff-btn" data-diff="medium">Medium</button>
      <button class="diff-btn" data-diff="hard">Hard</button>
    </div>

    <button class="start-btn" id="start-btn" disabled>Select</button>

  </div>
  <div class="screen" id="screen-quiz">

    <div class="quiz-topbar">
      <div class="quiz-meta">
        Question <strong id="q-current">1</strong> of <strong id="q-total">10</strong>
      </div>
      <div class="timer-pill" id="timer-pill">
        <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        <span id="timer-text">30</span>s
      </div>
    </div>

    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>

    <div class="question-card">
      <div class="question-num" id="q-num">Question 1</div>
      <div class="question-text" id="q-text"></div>
    </div>
    <div class="options-grid" id="options-grid"></div>

    <div class="explanation-box" id="explanation-box">
      <strong>Explanation —</strong> <span id="explanation-text"></span>
    </div>

    <div class="quiz-nav">
      <button class="btn-skip" id="btn-skip">Skip</button>
      <button class="btn-next" id="btn-next" disabled>
        Next
        <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2.5">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
    </div>

  </div>

  <div class="screen" id="screen-result">

    <div class="result-hero">
      <div class="score-ring-wrap">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle cx="70" cy="70" r="58" fill="none" stroke="#E4E0D8" stroke-width="10"/>
          <circle cx="70" cy="70" r="58" fill="none" stroke="#2D5BE3" stroke-width="10"
            stroke-linecap="round" stroke-dasharray="364.4"
            id="ring-fill" stroke-dashoffset="364.4"/>
        </svg>
        <div class="score-text">
          <span class="score-pct" id="score-pct">0%</span>
          <span class="score-sub">score</span>
        </div>
      </div>
      <h2 id="result-title">Well done!</h2>
      <p id="result-sub">You answered 7 out of 10 correctly.</p>
    </div>

    <div class="stats-row">
      <div class="stat-box">
        <span class="stat-val" id="stat-correct" style="color: var(--correct);">0</span>
        <span class="stat-lbl">Correct</span>
      </div>
      <div class="stat-box">
        <span class="stat-val" id="stat-wrong" style="color: var(--wrong);">0</span>
        <span class="stat-lbl">Wrong</span>
      </div>
      <div class="stat-box">
        <span class="stat-val" id="stat-skipped" style="color: var(--warn);">0</span>
        <span class="stat-lbl">Skipped</span>
      </div>
    </div>

    <div class="review-section">
      <h3>Review answers</h3>
      <div id="review-list"></div>
    </div>

    <div class="result-actions">
      <button class="btn-outline" id="btn-home">Home</button>
      <button class="btn-primary" id="btn-retry">Try again</button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
